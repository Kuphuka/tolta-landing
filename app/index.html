<!DOCTYPE html>
<html lang="en">
<head>
  <base href="/app/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Tolta — Local Goodness. Delivered.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Tolta">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FFFFFF">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0F0F0F">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">

  <title>Tolta</title>
  <link rel="manifest" href="manifest.json">

  <style id="splash-screen-style">
    html {
      height: 100%;
    }

    body {
      margin: 0;
      min-height: 100%;
      background-color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    .splash-wrap {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      width: 100%;
      padding: 0 24px;
      box-sizing: border-box;
    }

    .splash-logo {
      width: 140px;
      height: 140px;
      border-radius: 32px;
      object-fit: contain;
      margin: 0 auto 24px auto;
      display: block;
    }

    .splash-title {
      font-size: 44px;
      font-weight: 800;
      letter-spacing: -1.5px;
      color: #111111;
      margin: 0 0 8px 0;
    }

    .splash-tagline {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1.6px;
      color: #6A30E8;
      text-transform: uppercase;
      margin: 0;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background-color: #0F0F0F;
      }
      .splash-title {
        color: #FFFFFF;
      }
      .splash-tagline {
        color: #A78BFA;
      }
    }
  </style>

  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      document.getElementById("splash")?.remove();
      document.getElementById("splash-branding")?.remove();
      document.body.style.background = "transparent";
    }
  </script>

  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
</head>
<body>
  <div id="splash" class="splash-wrap">
    <img class="splash-logo" src="icons/Icon-512.png" alt="Tolta logo" />
    <h1 class="splash-title">Tolta</h1>
    <p class="splash-tagline">Local Goodness. Delivered.</p>
  </div>

  <script src="flutter_bootstrap.js" async=""></script>
</body>
</html>
